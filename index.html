<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
  font-family: "Noto Serif JP", "Yu Mincho", YuMincho, "Hiragino Mincho ProN", serif; color: #fff;
  background: #3a454e url("0001/img/top-poster.jpg") center / cover no-repeat; }
body::before { content: ""; position: fixed; inset: 0; background: rgba(40, 50, 58, .62); }
.box { position: relative; width: min(520px, 100%); padding: 72px 28px 40px; text-align: center; }
.house { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.house path { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 1; vector-effect: non-scaling-stroke; }
.label { position: relative; margin: 0; font-family: "EB Garamond", serif; font-size: 14px; letter-spacing: .3em; opacity: .9; }
h1 { position: relative; margin: 14px 0 0; font-size: clamp(22px, 5vw, 28px); font-weight: 500; letter-spacing: .1em; line-height: 1.6; }
.lead { position: relative; margin: 14px 0 32px; font-size: 14px; line-height: 1.9; letter-spacing: .06em; opacity: .9; }
.links { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.links a { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 190px; padding: 22px 12px 18px;
  background: #fff; color: #222; text-decoration: none; letter-spacing: .1em; transition: transform .2s, box-shadow .2s; }
.links a:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.links a.sp { background: #222; color: #fff; }
.links svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.links strong { font-size: 17px; font-weight: 600; }
.links small { font-family: "EB Garamond", serif; font-size: 13px; letter-spacing: .2em; opacity: .7; }
.note { position: relative; margin: 26px 0 0; font-size: 12px; line-height: 1.8; opacity: .8; }
.nw { display: inline-block; }
@media (max-width: 480px) {
  .box { padding: 104px 20px 32px; }
  h1 { font-size: 20px; }
  .lead { font-size: 13px; }
  .links a { width: 100%; max-width: 260px; flex-direction: row; justify-content: center; padding: 16px 12px; gap: 12px; }
  .links svg { width: 30px; height: 30px; }
  .links small { display: none; }
}
</style></head><body>
<div class="box">
  <svg class="house" viewBox="0 0 520 440" preserveAspectRatio="none" aria-hidden="true"><path d="M1 72 L260 1 L519 72 V439 H1 Z" /></svg>

  <div class="links">
    <a href="preview/pc.html"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="8" width="30" height="20" rx="1.5" /><path d="M15 33 H25 M20 28 V33" /></svg><strong>PC版を見る</strong><small>DESKTOP</small></a>
    <a class="sp" href="preview/sp.html"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="12" y="5" width="16" height="30" rx="2.5" /><path d="M18 31 H22" /></svg><strong>スマホ版を見る</strong><small>SMARTPHONE</small></a>
  </div>

</div>
